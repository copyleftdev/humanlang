      context: .
      dockerfile: docker/Dockerfile.dart
    container_name: humanlang-dart

  # ===========================================
  # SCIENTIFIC
  # ===========================================

  julia:
    build:
      context: .
      dockerfile: docker/Dockerfile.julia
    container_name: humanlang-julia

  r:
    build:
      context: .
